<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pending Off Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202b;--mute:#5d6b78;--line:#d6dce2;--acc:#0b5f73;--acc-ink:#fff;--warn:#b4442a;--ok:#1f7a4d;--chip:#e3eaef}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--ink:#e6edf3;--mute:#93a3b1;--line:#2b3946;--acc:#5ec0d6;--acc-ink:#07242c;--warn:#ff8a6b;--ok:#6fd29c;--chip:#223340}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
header{padding:22px 20px 8px;max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:22px;margin:0 0 2px;font-weight:600}.sub{color:var(--mute);margin:0}
main{max-width:1100px;margin:0 auto;padding:12px 20px 40px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 12px;font-weight:600}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{flex:1 1 90px;background:var(--chip);border-radius:8px;padding:8px 10px}
.stat b{display:block;font:500 20px "IBM Plex Mono",monospace}.stat span{color:var(--mute);font-size:12px}
input,select,button,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:var(--card)}
.tools{display:flex;gap:8px;margin-bottom:10px}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:8px 12px}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.link{border:0;background:none;color:var(--mute);padding:2px 6px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--mute);font-size:13px}
td.n,th.n{text-align:right;font-family:"IBM Plex Mono",monospace}
tr.row{cursor:pointer}tr.row:hover,tr.sel{background:var(--chip)}
.low{color:var(--warn);font-weight:600}.hi{color:var(--ok)}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}form .full{grid-column:1/-1}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:3px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0}.seg button.on{background:var(--acc);color:var(--acc-ink)}
ul{margin:0;padding:0}li{display:grid;grid-template-columns:90px 1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);list-style:none}
.tag{font:500 12px "IBM Plex Mono",monospace}.msg{color:var(--mute);padding:6px 0}.err{color:var(--warn)}
.hd{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<header>
<div><h1>Pending Off Tracker</h1><p class="sub">Public-holiday offs earned, used and left.</p></div>
<button class="link" id="ownerLink">Owner sign in</button>
</header>
<main>
<section id="balCard" class="card" style="display:none">
<h2>Staff balances</h2>
<div class="stats"><div class="stat"><b id="sStaff">0</b><span>Staff</span></div><div class="stat"><b id="sEarned">0</b><span>Days earned</span></div><div class="stat"><b id="sUsed">0</b><span>Days used</span></div><div class="stat"><b id="sLeft">0</b><span>Days left</span></div></div>
<div class="tools"><input id="q" placeholder="Search staff"><button id="addStaff">Add staff</button></div>
<div class="scroll"><table><thead><tr><th>Staff</th><th class="n">Earned</th><th class="n">Used</th><th class="n">Left</th></tr></thead><tbody id="rows"></tbody></table></div>
<div id="seedBox" class="msg"></div>
</section>
<section>
<div class="card" id="ownerCard" style="display:none"><h2>Owner sign in</h2>
<div class="tools"><input id="oe" type="email" placeholder="Email" autocomplete="username"><input id="op" type="password" placeholder="Password" autocomplete="current-password"></div>
<button class="pri" id="oBtn">Sign in</button> <span id="omsg" class="msg err"></span></div>
<div class="card" id="loginCard" style="display:none"><h2>Log in</h2>
<label for="un">Your username</label><input id="un" placeholder="Type your name as on the staff list" autocomplete="off" style="margin-bottom:8px">
<label for="pc">Private code (only if you were given one)</label>
<div class="tools"><input id="pc" type="password" autocomplete="off" placeholder="Private code"><button class="pri" id="loginBtn" type="button">Log in</button></div>
<div id="lmsg" class="msg err"></div></div>
<div class="card" id="formCard" style="display:none"><h2 id="fh">Record an entry</h2>
<form id="f">
<div class="full" id="typeRow"><label>Type</label><div class="seg"><button type="button" id="tUse" class="on">Day off used</button><button type="button" id="tEarn">Day off earned</button><button type="button" id="tPast">Past use (already counted)</button></div></div>
<div class="full" id="stRow"><label for="st">Staff</label><select id="st"></select></div>
<div id="dtRow"><label for="dt">Date</label><input id="dt" type="date" required></div>
<div id="dyRow"><label for="dy">Days</label><input id="dy" type="number" step="0.5" min="0.5" value="1" required></div>
<div class="full" id="bulkRow" style="display:none"><label for="bk">Each day used, one per line. Add :0.5 for a half day and | reason if a day has its own reason.</label><textarea id="bk" rows="6" placeholder="2025-12-02&#10;15/01/2026 | Eid Al Fitr&#10;2026-03-10:0.5"></textarea></div>
<div class="full"><label for="rs" id="rsl">Why it was used</label><input id="rs" placeholder="e.g. Eid Al Adha day off" required></div>
<div class="full" id="byRow"><label for="by">Approved by</label><input id="by" placeholder="Name"></div>
<div class="full"><button class="pri" type="submit" id="sub">Save entry</button> <span id="fmsg" class="msg"></span></div>
</form></div>
<div class="card" id="reqCard" style="display:none"><h2 id="reqH">Requests</h2><ul id="reqList"></ul><div id="reqMsg" class="msg"></div></div>
<div class="card" id="histCard" style="display:none">
<div class="stats" id="mine" style="display:none"><div class="stat"><b id="mE">0</b><span>Earned</span></div><div class="stat"><b id="mU">0</b><span>Used</span></div><div class="stat"><b id="mL">0</b><span>Pending left</span></div></div>
<div class="hd"><h2 id="hh">History</h2><span><button class="link" id="renBtn" style="display:none">Rename</button><button class="link" id="delBtn" style="display:none">Delete staff</button><button class="link" id="codeBtn" style="display:none">Set private code</button><button class="link" id="logout" style="display:none">Log out</button></span></div>
<ul id="hist"></ul><div id="hmsg" class="msg">Select a staff member to see their history.</div></div>
<div id="note" class="msg"></div>
</section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var C=window.APP_CONFIG;
if(!C||!C.firebase||!C.firebase.apiKey){$("note").className="msg err";$("note").textContent="Setup needed: fill in config.js (see README).";return}
firebase.initializeApp(C.firebase);
var auth=firebase.auth(),db=firebase.firestore();
var staff={},log={},reqs={},sel=null,type="use",me=null,isOwner=false,uid=null,unsubs=[];
var SEED=[["Angeline",19.5,13],["Hadeer",16,12],["Rosetan",23,19],["Rediet",15,10],["Sona",18,10.5],["Nagham",15,14],["Sheila",20,5],["Yuvette",32,9],["Rosette",37,14],["Nafisah",5,0],["Khadeeja",1,0],["Aswathy",1,0],["Sana",1,0],["Kezhia",24,9.5],["Sneha",21,12],["Neethu",36,20],["Rinu",23,8.5],["Aiswarya",17,5.5],["Athulya",16,5],["Liza",26,11],["Moemen",17,14],["Ardra",8,4],["Simi George",15,10],["Thejas",7,3],["Haritha",11,3.5]];
function fmt(n){return Number.isInteger(n)?String(n):n.toFixed(1)}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
function today(){return new Date().toISOString().slice(0,10)}
function fail(e){$("note").className="msg err";$("note").textContent="Could not save: "+(e&&e.message||"try again")}
function sha(s){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")})}
function bal(id){var s=staff[id],e=+s.openEarned||0,u=+s.openUsed||0;
Object.keys(log).forEach(function(k){var l=log[k];if(l.staff!==id)return;if(l.type==="earn")e+=+l.days||0;else if(l.type==="use")u+=+l.days||0});
return {e:e,u:u,l:e-u}}
function matchStaff(){var v=($("un").value||"").trim().toLowerCase();if(!v)return null;var f=null;Object.keys(staff).forEach(function(id){if(staff[id].name.toLowerCase()===v)f=id});return f}
function layout(){
var past=isOwner&&type==="past";
$("bulkRow").style.display=past?"":"none";$("dtRow").style.display=past?"none":"";$("dyRow").style.display=past?"none":"";$("dt").required=!past;$("dy").required=!past;$("rs").required=!past;
var main=isOwner||me;
$("balCard").style.display=isOwner?"":"none";
$("loginCard").style.display=(!isOwner&&!me)?"":"none";
["formCard","reqCard","histCard"].forEach(function(x){$(x).style.display=main?"":"none"});
["typeRow","stRow","byRow"].forEach(function(x){$(x).style.display=isOwner?"":"none"});
$("fh").textContent=isOwner?"Record an entry":"Apply for a pending off";
$("sub").textContent=isOwner?(past?"Save past days":"Save entry"):"Apply for pending off";
$("rsl").textContent=past?"Default reason (for lines without their own)":isOwner&&type==="use"?"Why it was used":isOwner?"Holiday worked / why earned":"Reason for the day off";
$("logout").style.display=(!isOwner&&me)?"":"none";
$("ownerLink").textContent=isOwner?"Sign out":"Owner sign in";
document.querySelector("main").style.gridTemplateColumns=isOwner?"":"minmax(0,560px)";
if(!isOwner)$("dt").min=today()}
function render(){
var ids=Object.keys(staff).sort(function(a,b){return staff[a].name.localeCompare(staff[b].name)});
var q=$("q").value.trim().toLowerCase(),te=0,tu=0,h="";
ids.forEach(function(id){var b=bal(id);te+=b.e;tu+=b.u;if(q&&staff[id].name.toLowerCase().indexOf(q)<0)return;
h+='<tr class="row'+(id===sel?' sel':'')+'" data-id="'+esc(id)+'"><td>'+esc(staff[id].name)+(staff[id].codeHash?' <span class="tag">code</span>':'')+'</td><td class="n">'+fmt(b.e)+'</td><td class="n">'+fmt(b.u)+'</td><td class="n '+(b.l<=1?'low':b.l>=15?'hi':'')+'">'+fmt(b.l)+'</td></tr>'});
$("rows").innerHTML=h;
$("sStaff").textContent=ids.length;$("sEarned").textContent=fmt(te);$("sUsed").textContent=fmt(tu);$("sLeft").textContent=fmt(te-tu);
var cur=$("st").value;
$("st").innerHTML=ids.map(function(id){return '<option value="'+esc(id)+'">'+esc(staff[id].name)+'</option>'}).join("");
if(cur&&staff[cur])$("st").value=cur;else if(sel&&staff[sel])$("st").value=sel;
$("seedBox").innerHTML=(isOwner&&!ids.length)?'No staff yet. <button class="pri" id="seedBtn">Import the 25 staff from your sheet</button>':"";
if(!isOwner)sel=me;
layout();reqList();history_()}
function history_(){
if(!sel||!staff[sel]){$("mine").style.display="none";$("codeBtn").style.display="none";$("renBtn").style.display="none";$("delBtn").style.display="none";$("hh").textContent="History";$("hist").innerHTML="";$("hmsg").style.display="";return}
var b=bal(sel),items=Object.keys(log).filter(function(k){return log[k].staff===sel}).sort(function(a,c){return (log[c].date||"").localeCompare(log[a].date||"")});
$("hh").textContent=staff[sel].name+" \u2014 "+fmt(b.l)+" left";
$("mine").style.display="";$("mE").textContent=fmt(b.e);$("mU").textContent=fmt(b.u);$("mL").textContent=fmt(b.l);
$("renBtn").style.display=isOwner?"":"none";$("delBtn").style.display=isOwner?"":"none";$("codeBtn").style.display=isOwner?"":"none";$("codeBtn").textContent=staff[sel].codeHash?"Change or remove code":"Set private code";
var h='',pastSum=0;items.forEach(function(k){if(log[k].type==="past")pastSum+=+log[k].days||0});var rest=(+staff[sel].openUsed||0)-pastSum;
if(+staff[sel].openUsed)h+='<li><span class="tag">Before log</span><span>Used '+fmt(+staff[sel].openUsed)+' days before this log. Itemised below: '+fmt(pastSum)+(rest>0?'. Not yet itemised: '+fmt(rest):rest<0?'. Itemised is more than this total by '+fmt(-rest):'. All itemised.')+(staff[sel].openNote?'<br><span class="sub">Comment: '+esc(staff[sel].openNote)+'</span>':'')+'</span>'+(isOwner?'<button class="link" data-cmo="1">Comment</button>':'<span></span>')+'</li>';
items.forEach(function(k){var l=log[k];
h+='<li><span class="tag">'+esc(l.date)+'</span><span>'+(l.type==="earn"?'Earned ':'Used ')+fmt(+l.days)+' day'+(+l.days===1?'':'s')+' \u2014 '+esc(l.reason)+(l.type==="past"?' <span class="sub">(already in opening total)</span>':'')+(l.by?' <span class="sub">(approved by '+esc(l.by)+')</span>':'')+(l.comment?'<br><span class="sub">Comment: '+esc(l.comment)+'</span>':'')+'</span>'+(isOwner?'<span><button class="link" data-cm="'+esc(k)+'">Comment</button><button class="link" data-del="'+esc(k)+'">Delete</button></span>':'<span></span>')+'</li>'});
$("hist").innerHTML=h;$("hmsg").style.display=h?"none":"";if(!h)$("hmsg").textContent="No entries yet."}
function reqList(){var h="";
if(isOwner){Object.keys(reqs).forEach(function(u){(reqs[u]||[]).forEach(function(r){if(r.status!=="pending"||!staff[r.staff])return;
h+='<li><span class="tag">'+esc(r.date)+'</span><span>'+esc(staff[r.staff].name)+' \u2014 '+fmt(+r.days)+' day'+(+r.days===1?'':'s')+' \u2014 '+esc(r.reason)+'</span><span><button class="link" data-act="ok" data-u="'+esc(u)+'" data-r="'+esc(r.id)+'">Approve</button><button class="link" data-act="no" data-u="'+esc(u)+'" data-r="'+esc(r.id)+'">Decline</button></span></li>'})});
$("reqH").textContent="Requests to approve";$("reqMsg").textContent=h?"":"No pending requests."}
else{(reqs[uid]||[]).slice().reverse().forEach(function(r){h+='<li><span class="tag">'+esc(r.date)+'</span><span>'+fmt(+r.days)+' day'+(+r.days===1?'':'s')+' \u2014 '+esc(r.reason)+'</span><span class="tag">'+esc(r.status)+'</span></li>'});
$("reqH").textContent="Your requests";$("reqMsg").textContent=h?"":"You have not applied yet."}
$("reqList").innerHTML=h}
function start(){
unsubs.forEach(function(u){u()});unsubs=[];staff={};log={};reqs={};
var er=function(e){fail(e)};
unsubs.push(db.collection("staff").onSnapshot(function(s){staff={};s.forEach(function(d){staff[d.id]=d.data()});render()},er));
unsubs.push(db.collection("log").onSnapshot(function(s){log={};s.forEach(function(d){log[d.id]=d.data()});render()},er));
if(isOwner)unsubs.push(db.collection("requests").onSnapshot(function(s){reqs={};s.forEach(function(d){reqs[d.id]=d.data().items||[]});reqList()},er));
else unsubs.push(db.doc("requests/"+uid).onSnapshot(function(d){reqs={};reqs[uid]=d.exists?(d.data().items||[]):[];reqList()},er));
render()}
auth.onAuthStateChanged(function(u){
if(!u){auth.signInAnonymously().catch(function(e){$("note").className="msg err";$("note").textContent="Sign-in failed: "+e.message});return}
uid=u.uid;isOwner=!u.isAnonymous&&u.uid===C.ownerUid;me=null;sel=null;
$("ownerCard").style.display="none";start()});
$("ownerLink").onclick=function(){if(isOwner){auth.signOut();return}var c=$("ownerCard");c.style.display=c.style.display==="none"?"":"none"};
$("oBtn").onclick=function(){$("omsg").textContent="";auth.signInWithEmailAndPassword($("oe").value.trim(),$("op").value).catch(function(e){$("omsg").textContent="Sign-in failed."})};
$("rows").addEventListener("click",function(e){var r=e.target.closest("tr");if(!r)return;sel=r.dataset.id;$("st").value=sel;render()});
$("q").addEventListener("input",render);
$("st").addEventListener("change",function(){if(isOwner){sel=$("st").value;render()}});
$("hist").addEventListener("click",function(e){if(!isOwner)return;var cm=e.target.getAttribute("data-cm");if(cm){var c=prompt("Comment for this entry (leave empty to remove)",log[cm].comment||"");if(c!==null)db.collection("log").doc(cm).set({comment:c.trim()},{merge:true}).catch(fail);return}if(e.target.getAttribute("data-cmo")){var o=prompt("Comment on the days used before this log (leave empty to remove)",staff[sel].openNote||"");if(o!==null)db.collection("staff").doc(sel).set({openNote:o.trim()},{merge:true}).catch(fail);return}var k=e.target.getAttribute("data-del");if(!k)return;if(confirm("Delete this entry?"))db.collection("log").doc(k).delete().catch(fail)});
$("reqList").addEventListener("click",function(e){var a=e.target.getAttribute("data-act");if(!a||!isOwner)return;
var u=e.target.getAttribute("data-u"),id=e.target.getAttribute("data-r"),items=reqs[u]||[],r=items.filter(function(x){return x.id===id})[0];if(!r)return;
var next=items.map(function(x){return x.id===id?Object.assign({},x,{status:a==="ok"?"approved":"declined"}):x});
var p=a==="ok"?db.collection("log").add({staff:r.staff,type:"use",date:r.date,days:r.days,reason:r.reason,by:"Manager"}):Promise.resolve();
p.then(function(){return db.doc("requests/"+u).set({items:next})}).catch(fail)});
$("seedBox").addEventListener("click",function(e){if(e.target.id!=="seedBtn"||!isOwner)return;
var b=db.batch();SEED.forEach(function(s){b.set(db.collection("staff").doc(s[0].toLowerCase().replace(/\s+/g,"-")),{name:s[0],openEarned:s[1],openUsed:s[2]})});b.commit().catch(fail)});
$("addStaff").onclick=function(){if(!isOwner)return;var n=(prompt("Staff name")||"").trim();if(!n)return;
var o=parseFloat(prompt("Days earned so far (opening balance)","0"))||0,u=parseFloat(prompt("Days already used","0"))||0;
db.collection("staff").add({name:n,openEarned:o,openUsed:u}).catch(fail)};
$("renBtn").onclick=function(){if(!isOwner||!sel)return;var n=(prompt("New name for "+staff[sel].name,staff[sel].name)||"").trim();if(!n||n===staff[sel].name)return;
var dup=Object.keys(staff).some(function(id){return id!==sel&&staff[id].name.toLowerCase()===n.toLowerCase()});
if(dup){alert("Another staff member already has that name.");return}
db.collection("staff").doc(sel).set({name:n},{merge:true}).catch(fail)};
$("delBtn").onclick=function(){if(!isOwner||!sel)return;var id=sel,ks=Object.keys(log).filter(function(k){return log[k].staff===id});
if(!confirm("Delete "+staff[id].name+" and "+ks.length+" history entr"+(ks.length===1?"y":"ies")+"? This cannot be undone."))return;
var b=db.batch();ks.forEach(function(k){b.delete(db.collection("log").doc(k))});b.delete(db.collection("staff").doc(id));
b.commit().then(function(){sel=null;render()}).catch(fail)};
$("codeBtn").onclick=function(){if(!isOwner||!sel)return;var c=prompt("Private code for "+staff[sel].name+". Leave empty to remove it.","");if(c===null)return;c=c.trim();
var p=c?sha(sel+":"+c):Promise.resolve(null);
p.then(function(h){return db.collection("staff").doc(sel).set({codeHash:h},{merge:true})}).catch(fail)};
function setType(t){type=t;$("tUse").classList.toggle("on",t==="use");$("tEarn").classList.toggle("on",t==="earn");$("tPast").classList.toggle("on",t==="past");layout()}
$("tUse").onclick=function(){setType("use")};$("tEarn").onclick=function(){setType("earn")};$("tPast").onclick=function(){setType("past")};
function enter(id){me=id;$("lmsg").textContent="";sel=id;render()}
function login(){var id=matchStaff(),bad="Username or code not correct.";if(!id){$("lmsg").textContent=bad;return}
var want=staff[id].codeHash;
if(want){sha(id+":"+$("pc").value.trim()).then(function(h){if(h===want)enter(id);else $("lmsg").textContent=bad}).catch(function(){$("lmsg").textContent="Could not check the code here."});return}
enter(id)}
$("loginBtn").onclick=login;
[$("un"),$("pc")].forEach(function(i){i.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();login()}})});
$("logout").onclick=function(){me=null;sel=null;$("un").value="";$("pc").value="";render()};
$("f").addEventListener("submit",function(e){e.preventDefault();
var reason=$("rs").value.trim();
if(isOwner&&type==="past"){pastSave(reason);return}
var days=parseFloat($("dy").value),date=$("dt").value;
if(!date||!(days>0)||!reason)return;
var ok=function(){$("rs").value="";$("fmsg").textContent=isOwner?"Saved.":"Request sent for approval.";setTimeout(function(){$("fmsg").textContent=""},3000)};
if(isOwner){var s=$("st").value;if(!s)return;
if(type==="use"&&days>bal(s).l&&!confirm("This is more than their balance left. Save anyway?"))return;
db.collection("log").add({staff:s,type:type,date:date,days:days,reason:reason,by:$("by").value.trim()}).then(function(){sel=s;ok()}).catch(fail);return}
if(!me)return;
if(days>bal(me).l&&!confirm("This is more than your balance left. Apply anyway?"))return;
var rec={id:Date.now().toString(36),staff:me,date:date,days:days,reason:reason,status:"pending"};
db.doc("requests/"+uid).set({items:(reqs[uid]||[]).concat([rec])}).then(ok).catch(fail)});
